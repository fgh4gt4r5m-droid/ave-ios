# Projet Xcode décrit pour XcodeGen (https://github.com/yonaskolb/XcodeGen) : `xcodegen generate` produit AVE.xcodeproj
# (non committé). Codemagic le génère à chaque build (voir codemagic.yaml). Le code vit dans le package SwiftPM (Package.swift).
name: AVE
options:
  bundleIdPrefix: fr.ave
  deploymentTarget:
    iOS: "27.0"                   # décision du propriétaire (2026-10-23) : iOS 27 minimum, compilé avec Xcode 27.1
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    DEVELOPMENT_TEAM: ""          # renseigné par la signature Codemagic ; vide = pas de signature (simulateur)
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  AVEPackage:
    path: .                       # Package.swift à la racine : produits AVECore et AVEKit
targets:
  AVE:
    type: application
    platform: iOS
    sources:
      - path: AVE/App
    dependencies:
      - package: AVEPackage
        product: AVECore
      - package: AVEPackage
        product: AVEKit
      - target: AVELiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.ave.app
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/AVE.entitlements
        TARGETED_DEVICE_FAMILY: "1"          # iPhone seulement
      configs:
        Debug:
          INFOPLIST_FILE: Config/AVE-Info-Debug.plist   # + exception ATS réseau local
        Release:
          INFOPLIST_FILE: Config/AVE-Info.plist
  AVELiveActivity:
    type: app-extension
    platform: iOS
    # Pas de dépendance au package : si l'app lie AVECore + AVEKit et l'extension AVEKit seul, Xcode veut construire
    # les cibles partagées en dynamique et échoue (« cannot be built dynamically because there is a package product
    # with the same name »). Les trois fichiers sans dépendance utiles au widget sont compilés ici directement
    # (modèle d'Apple pour les attributs d'une Live Activity, partagés par nom de type).
    sources:
      - path: AVE/LiveActivity
      - path: AVE/Kit/AVESessionAttributes.swift
      - path: AVE/Kit/AVEPalette.swift
      - path: AVE/Features/VoiceAssistant/LiveActivityPhase.swift
    info:
      path: Config/AVELiveActivity-Info.plist
      properties:
        CFBundleDisplayName: AVE
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.ave.app.liveactivity
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  AVE:
    build:
      targets:
        AVE: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: AVEPackage/AVETests      # les tests Swift Testing du package, exécutés sur simulateur
    archive:
      config: Release
