# Codemagic : https://docs.codemagic.io/yaml-quick-start/building-a-native-ios-app/
# Deux workflows : `ave-ci` (compile et teste, sans signature) et `ave-testflight` (manuel, nécessite la configuration Apple).
workflows:
  ave-ci:
    name: "AVE - compilation et tests"
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      # Version fixée : « latest » désigne la version par défaut de Codemagic (26.6 le 2026-10-23), trop ancienne pour iOS 27.
      # 27.0 et non 27.1 (2026-10-23, accord du propriétaire) : avec 27.1, les builds restaient sur « Preparing build machine »
      # (aucune machine 27.1 offerte aux comptes gratuits à ce moment-là), comme WoYo le 2026-10-10 (commit 59f3905 de
      # woyo_app). 27.0 contient le SDK d'iOS 27 ; aucune API propre à 27.1 n'est utilisée. Remonter quand c'est disponible.
      xcode: 27.0
    triggering:
      events: [push, pull_request]
      branch_patterns:
        - pattern: main
          include: true
        - pattern: "*"
          include: true
    scripts:
      - name: "Version des outils"
        script: |
          xcodebuild -version
          swift --version
      - name: "Tests du package sur macOS (logique pure : protocole, client, audio, écrans, authentification)"
        script: swift test --parallel
      - name: "Installer XcodeGen"
        script: brew install xcodegen
      - name: "Générer le projet Xcode"
        script: xcodegen generate
      - name: "Compiler l'app (simulateur iOS, sans signature) : compile TOUT le code iOS (AVFoundation, SwiftUI, ActivityKit)"
        script: |
          set -o pipefail
          xcodebuild -project AVE.xcodeproj -scheme AVE -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log || { echo '--- 80 dernières lignes ---'; tail -n 80 build.log; exit 1; }
      - name: "Tests sur simulateur iOS"
        script: |
          set -o pipefail
          # Premier iPhone du runtime iOS 27 : la machine a aussi un runtime 26.x, inférieur au minimum de l'app.
          DEVICE=$(xcrun simctl list devices available | awk '/^-- iOS 27/ {f=1; next} /^--/ {f=0} f && /iPhone/ {sub(/^ +/, ""); sub(/ \(.*/, ""); print; exit}')
          echo "Simulateur : $DEVICE"
          xcodebuild -project AVE.xcodeproj -scheme AVE -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEVICE,OS=latest" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee test.log || { echo '--- 80 dernières lignes ---'; tail -n 80 test.log; exit 1; }
    artifacts:
      - build.log
      - test.log

  ave-testflight:
    name: "AVE - TestFlight (manuel)"
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Prérequis (voir APPSTORE.md, § TestFlight) : clé API App Store Connect de l'équipe (TAM_ASC_KEY) dans Codemagic, certificat
    # Apple Distribution et profils App Store des DEUX identifiants (app et extension) récupérés dans Codemagic, fiche de l'app
    # créée dans App Store Connect, groupe de variables « ave » (AVE_ENDPOINT, AVE_ACCOUNTS_URL).
    integrations:
      app_store_connect: TAM_ASC_KEY   # clé API de l'équipe (partagée avec WoYo et Driver)
    environment:
      groups:
        - ave                       # AVE_ENDPOINT (wss://…/v1/stream), AVE_ACCOUNTS_URL (https://…) : adresses réelles
      xcode: 27.0                 # même version que ave-ci (voir l'explication en tête de ce workflow)
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tam.ave   # Codemagic prend aussi les profils com.tam.ave.* (l'extension Live Activity)
    scripts:
      - name: "Vérifier les adresses (pas de placeholder .example, wss/https seulement)"
        script: |
          case "$AVE_ENDPOINT" in wss://*) ;; *) echo "AVE_ENDPOINT doit commencer par wss:// (groupe « ave »)"; exit 1 ;; esac
          case "$AVE_ACCOUNTS_URL" in https://*) ;; *) echo "AVE_ACCOUNTS_URL doit commencer par https:// (groupe « ave »)"; exit 1 ;; esac
          case "$AVE_ENDPOINT$AVE_ACCOUNTS_URL" in *.example*) echo "Adresse provisoire .example : renseigner les vraies adresses"; exit 1 ;; esac
      - name: "Installer XcodeGen et générer le projet"
        script: |
          brew install xcodegen
          xcodegen generate
      - name: "Signature (testeurs internes seulement : pas de revue Apple)"
        script: |
          xcode-project use-profiles             --export-options-plist "$HOME/export_options.plist"             --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: "Archive et export"
        script: |
          set -o pipefail
          # Numéro de build = date et heure UTC (AAMMJJHHMM) : croissant quel que soit le compte Codemagic ou le workflow
          # (le compteur BUILD_NUMBER de Codemagic est propre à chaque compte et workflow ; Apple refuse un numéro déjà vu).
          BUILD_ID=$(date -u +%y%m%d%H%M)
          echo "Numéro de build : $BUILD_ID"
          xcodebuild -project AVE.xcodeproj -scheme AVE -configuration Release             -destination 'generic/platform=iOS' -archivePath build/AVE.xcarchive             AVE_ENDPOINT="$AVE_ENDPOINT" AVE_ACCOUNTS_URL="$AVE_ACCOUNTS_URL"             CURRENT_PROJECT_VERSION="$BUILD_ID" archive 2>&1 | tee archive.log | tail -n 40
          xcodebuild -exportArchive -archivePath build/AVE.xcarchive -exportPath build/ipa             -exportOptionsPlist "$HOME/export_options.plist"
    artifacts:
      - build/ipa/*.ipa
      - archive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # testeurs internes : le build leur est proposé sans revue après traitement par Apple

  ave-testflight-demo:
    name: "AVE - TestFlight démo interface (manuel)"
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Build à TOUCHER (2026-10-23). Si le service de comptes répond sur Render : vrais comptes (vrais codes) et VRAI moteur
    # (en ligne sur Render depuis le 2026-10-23 ; il répond encore par écho avec un son de test, avis « Version d'essai »).
    # Sinon : faux service de comptes (code 000000) et moteur de démo HORS LIGNE sur l'iPhone, tous deux annoncés à
    # l'écran (le jeton du faux service n'ouvre pas le vrai moteur). Le journal du build dit lequel. Export réservé aux
    # testeurs internes : ne peut pas partir sur l'App Store.
    # Prérequis : les mêmes que ave-testflight SAUF le groupe « ave ».
    integrations:
      app_store_connect: TAM_ASC_KEY   # clé API de l'équipe (même nom dans chaque compte Codemagic)
    environment:
      xcode: 27.0                 # même version que ave-ci (voir l'explication en tête de ce workflow)
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tam.ave   # profils com.tam.ave et com.tam.ave.liveactivity
      vars:
        # Adresse du service de comptes sur Render (préproduction). Si Render en affiche une autre, la changer ici.
        AVE_RENDER_ACCOUNTS_URL: https://ave-accounts.onrender.com
        # Moteur sur Render (adresse donnée par la session moteur et vérifiée le 2026-10-23 : /healthz répond).
        AVE_RENDER_ENGINE_URL: wss://ave-engine.onrender.com/v1/stream
        AVE_RENDER_ENGINE_HEALTH: https://ave-engine.onrender.com/healthz
    scripts:
      - name: "Installer XcodeGen et générer le projet"
        script: |
          brew install xcodegen
          xcodegen generate
      - name: "Signature (testeurs internes seulement : pas de revue Apple)"
        script: |
          xcode-project use-profiles             --export-options-plist "$HOME/export_options.plist"             --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: "Archive démo et export"
        script: |
          set -o pipefail
          BUILD_ID=$(date -u +%y%m%d%H%M)
          echo "Numéro de build : $BUILD_ID"
          # Vrais comptes ET vrai moteur si les deux répondent ; sinon tout en démo (faux comptes, moteur hors ligne).
          DEMO_ACCOUNTS=YES; ACCOUNTS_URL=""; DEMO_OFFLINE=YES; ENDPOINT="$AVE_RENDER_ENGINE_URL"
          if curl -fsS -m 30 "$AVE_RENDER_ACCOUNTS_URL/healthz" > /dev/null; then
            DEMO_ACCOUNTS=NO; ACCOUNTS_URL="$AVE_RENDER_ACCOUNTS_URL"
            # Render peut mettre une minute à réveiller un service : deux essais.
            if curl -fsS -m 60 "$AVE_RENDER_ENGINE_HEALTH" > /dev/null || curl -fsS -m 60 "$AVE_RENDER_ENGINE_HEALTH" > /dev/null; then
              DEMO_OFFLINE=NO
              echo "Comptes ET moteur en ligne : vrais codes, vrai moteur ($AVE_RENDER_ENGINE_URL)"
            else
              echo "Comptes en ligne, moteur injoignable : vrais codes, moteur de démo hors ligne"
            fi
          else
            echo "Service de comptes injoignable : FAUX service (code 000000) et moteur de démo hors ligne"
          fi
          xcodebuild -project AVE.xcodeproj -scheme AVE -configuration Release             -destination 'generic/platform=iOS' -archivePath build/AVE.xcarchive             AVE_DEMO_OFFLINE="$DEMO_OFFLINE" AVE_DEMO_ACCOUNTS="$DEMO_ACCOUNTS" AVE_ACCOUNTS_URL="$ACCOUNTS_URL"             AVE_ENDPOINT="$ENDPOINT"             CURRENT_PROJECT_VERSION="$BUILD_ID" archive 2>&1 | tee archive.log | tail -n 40
          xcodebuild -exportArchive -archivePath build/AVE.xcarchive -exportPath build/ipa             -exportOptionsPlist "$HOME/export_options.plist"
    artifacts:
      - build/ipa/*.ipa
      - archive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
